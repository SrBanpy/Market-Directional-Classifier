# Market Directional Classifier - Configuration

# Market Data
data:
  ticker: "^GSPC"
  macro_tickers:
    - "^VIX"
    - "^TNX"
  start_date: "2000-01-01"
  interval: "1d"

# Model
model:
  pivot_window: 10
  test_size: 0.2
  xgboost:
    n_estimators: 1000
    learning_rate: 0.01
    max_depth: 4
    subsample: 0.7
    colsample_bytree: 0.7
    early_stopping_rounds: 50
    random_state: 42

# Trading
trading:
  commission: 0.001
  slippage: 0.0005
  signals:
    prob_buy_bull: 0.30
    prob_buy_bear: 0.60
    rsi_max_bull: 60
    rsi_max_bear: 30
    prob_sell_threshold: 0.50
    rsi_min_short: 45
    prob_exit: 0.40
    rsi_exit_bull: 80
    rsi_exit_bear: 70

# Risk Management
risk:
  max_position_pct: 1.0
  kelly_fraction: 0.5
  stop_loss_pct: 0.05
  trailing_stop_pct: 0.03
  max_daily_loss_pct: 0.02
  max_drawdown_pct: 0.15

# Metrics
metrics:
  risk_free_rate: 0.04
  trading_days: 252

# Paths
paths:
  model_dir: "models"
  assets_dir: "assets"
  logs_dir: "logs"
